name: CLI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.0 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.93.0 fmt --all --check
      - run: cargo +1.93.0 clippy --all-targets --locked -- -D warnings
      - run: cargo +1.93.0 test --locked
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --all-targets --locked
